name: P0 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-only-local-test-secret-with-40characters
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Inspect pinned browser asset integrity
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const sources = {
            pdf: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
            pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
            azure: 'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.52.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js'
          };
          for(const [name,url] of Object.entries(sources)){
            const response=await fetch(url,{signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error(name+' HTTP '+response.status);
            const bytes=Buffer.from(await response.arrayBuffer());
            console.log('INTEGRITY',name,bytes.byteLength,'sha256-'+createHash('sha256').update(bytes).digest('base64'));
          }
          NODE
      - name: Configure offline demo
        run: |
          cp .env.example .env
          sed -i 's/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=ci-only-local-test-secret-with-40characters/' .env
          pnpm db:migrate
      - name: Static analysis, unit tests and production build
        run: pnpm check
      - name: Browser smoke tests
        run: |
          pnpm --filter @interview/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Build single-service Docker image
        run: docker build -t interview-simulation:p0 .
      - name: Verify Docker cold-start and health
        run: |
          docker run -d --name interview-p0 -p 3005:3000 -e BETTER_AUTH_SECRET=ci-only-local-test-secret-with-40characters -e APP_URL=http://localhost:3005 interview-simulation:p0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3005/api/health; then exit 0; fi
            sleep 2
          done
          docker logs interview-p0
          exit 1
