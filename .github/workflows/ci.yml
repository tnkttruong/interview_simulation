name: P0 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-only-local-test-secret-with-40characters
      DEMO_MODE: "true"
    permissions:
      contents: write # one-time lockfile bootstrap for a same-repo PR, never fork PRs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Do not enable pnpm cache before the initial lockfile bootstrap.
      - name: Bootstrap a missing lockfile (same-repo PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml || [ ! -f pnpm-lock.yaml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "build: pin reproducible pnpm dependencies"
            git push origin HEAD:"$HEAD_REF"
          fi
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Configure offline demo
        run: |
          cp .env.example .env
          sed -i 's/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=ci-only-local-test-secret-with-40characters/' .env
          pnpm db:migrate
      - name: Static analysis, unit tests and production build
        run: pnpm check
      - name: Browser smoke tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Build single-service Docker image
        run: docker build -t interview-simulation:p0 .
      - name: Verify Docker cold-start and health
        run: |
          docker run -d --name interview-p0 -p 3005:3000 -e BETTER_AUTH_SECRET=ci-only-local-test-secret-with-40characters -e APP_URL=http://localhost:3005 interview-simulation:p0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3005/api/health; then exit 0; fi
            sleep 2
          done
          docker logs interview-p0
          exit 1
