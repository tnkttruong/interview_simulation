services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ROOT_DIR: /app
      DATABASE_URL: /data/interview.db
      APP_URL: "${APP_URL:-http://localhost:3000}"
      DEMO_MODE: "true"
    ports:
      - "3000:3000"
    volumes:
      - interview_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  interview_data:
